# Workflow to run tests

name: CI

on:
  push:
    branches: [ reproducer_ksp_annotation_internal ]

jobs:
  ksp-processor-options-internal:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Java 17
      uses: actions/setup-java@v1.4.3
      with:
        java-version: '17'
        java-package: jdk
        architecture: x64

    - uses: actions/checkout@v2

    - name: ksp_processor_options_internal
      shell: bash
      run: |
        ./gradlew publishToMavenLocal
        curl -s -L -O https://github.com/gradle/develocity-build-validation-scripts/releases/download/v2.8/develocity-gradle-build-validation-2.8.zip && unzip -q -o develocity-gradle-build-validation-2.8.zip
        cd develocity-gradle-build-validation
        ./03-validate-local-build-caching-different-locations.sh -t assembleDebug -r https://github.com/cdsap/KspNowInAndroid.git -b ksp_processor_options_internal
      env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_KEY }}

  ksp-2-2-0:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Java 17
      uses: actions/setup-java@v1.4.3
      with:
        java-version: '17'
        java-package: jdk
        architecture: x64

    - uses: actions/checkout@v2
    - name: ksp_2.2.0-2.0.2
      shell: bash
      run: |
        curl -s -L -O https://github.com/gradle/develocity-build-validation-scripts/releases/download/v2.8/develocity-gradle-build-validation-2.8.zip && unzip -q -o develocity-gradle-build-validation-2.8.zip
        cd develocity-gradle-build-validation
        ./03-validate-local-build-caching-different-locations.sh -t assembleDebug -r https://github.com/cdsap/KspNowInAndroid.git -b ksp_2.2.0-2.0.2
      env:
        DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_KEY }}
